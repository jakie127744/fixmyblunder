<html lang="en">
<head>

<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Blunderprint</div>
    <div class="row" style="gap:4px">
      <button class="chip" id="streakChip" hidden></button>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <div id="offline" class="offline" hidden>You are offline. Drills and reports still work. Importing needs a connection.</div>
  <div id="bgbar" class="bgbar" hidden role="status"><span></span><div class="bar"><i></i></div></div>
  <main id="view" tabindex="-1"></main>
  <div id="sr" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <p class="note">Your games and progress stay on this device.<br><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <button class="link inline" data-act="feedback" type="button">Send feedback</button></p>
</div>

<div class="tabs" id="tabs" hidden><nav aria-label="Main">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Today<span class="badge" id="dueBadge" hidden></span></button>
  <button data-tab="diagnose"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3"/></svg>Diagnose</button>
  <button data-tab="retry"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 12h9V3M12 12v9h9"/></svg>Retry</button>
  <button data-tab="puzzles"><svg viewBox="0 0 24 24"><path d="M9 4h3a2 2 0 1 1 4 0h3v4a2 2 0 1 0 0 4v4h-4a2 2 0 1 0-4 0H5v-4a2 2 0 1 1 0-4V4h4z"/></svg>Puzzles</button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Report</button>
</nav></div>

<div class="scrim hide" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast hide" id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
